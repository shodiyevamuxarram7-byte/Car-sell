<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Avto Savdo Simulyatori</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #1b1d22; font-family: system-ui, sans-serif; touch-action: none; }
  canvas { display: block; }
  #hud { position: fixed; top: 12px; left: 12px; color: #fff; font-size: 14px; line-height: 1.4;
         background: rgba(0,0,0,.45); padding: 8px 12px; border-radius: 8px; pointer-events: none; }
  #joy { position: fixed; left: 24px; bottom: 32px; width: 120px; height: 120px; border-radius: 50%;
         background: rgba(255,255,255,.12); border: 2px solid rgba(255,255,255,.3); display: none; }
  #stick { position: absolute; left: 35px; top: 35px; width: 50px; height: 50px; border-radius: 50%; background: rgba(255,255,255,.5); }
  @media (pointer: coarse) { #joy { display: block; } }
  #hud { font-size: 12px; padding: 6px 10px; }
  #fs { position: fixed; top: 12px; right: 12px; width: 44px; height: 44px; border-radius: 10px; border: 0;
        background: rgba(0,0,0,.5); color: #fff; font-size: 22px; }
  #rotate { position: fixed; inset: 0; z-index: 10; background: #14161b; color: #fff; display: none;
            flex-direction: column; align-items: center; justify-content: center; text-align: center; padding: 24px; gap: 18px; }
  #rotate .ico { font-size: 64px; }
  #rotate button { font-size: 18px; padding: 12px 22px; border-radius: 12px; border: 0; background: #2e6fd8; color: #fff; }
  @media (orientation: portrait) { #rotate { display: flex; } }
  #err { position: fixed; left: 12px; right: 12px; bottom: 12px; z-index: 20; background: #7a1c1c; color: #fff;
         padding: 10px 12px; border-radius: 8px; font-size: 13px; display: none; word-break: break-word; }
</style>
</head>
<body>
<div id="hud"><b>Avto Savdo Ofisi</b><br>Harakat: WASD / strelkalar<br>Kamera: sichqoncha yoki barmoq bilan suring</div>
<div id="joy"><div id="stick"></div></div>
<button id="fs" title="To'liq ekran">⛶</button>
